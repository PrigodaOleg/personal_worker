# Конфиг OpenHands-сервера (docker/openhands-flutter).
#
# Монтируется в контейнер как /app/config.toml (WORKDIR) — читается при
# старте сервера (load_openhands_config). Секреты сюда НЕ класть:
# LLM_* передаются через environment (docker-compose + deploy/sync_secrets).
#
# Зачем это нужно: агент запускает Android-эмулятор внутри дочернего
# runtime-контейнера. Без /dev/kvm qemu работает через чистую программную
# эмуляцию: эмулятор стартует криво (swiftshader ColorBuffer-ошибки) и
# умирает, агент получает пустые команды (exit code -1) и зацикливается —
# OpenHands убивает задачу (AgentStuckInLoopError). /dev/kvm есть на хосте,
# но OpenHands по умолчанию не пробрасывает устройства в runtime —
# docker_runtime_kwargs передаётся напрямую в docker containers.run().
[sandbox]
docker_runtime_kwargs = { devices = ["/dev/kvm"] }

# Нативный function calling для ВСЕХ моделей.
#
# Без этого OpenHands доверяет нативные tool-calls только моделям из
# зашитого списка (openhands/llm/model_features.py: gpt-5*, claude-*,
# qwen3-coder, ...). Для «неизвестных» (glm, kimi, minimax, grok,
# deepseek-v4) включается ТЕКСТОВЫЙ формат: модель учится писать
# <function=...><parameter=...> обычным текстом, и на длинных задачах
# метается между форматами — забывает security_risk, выдаёт сырую
# разметку, исполняет пустые команды. Провайдер (provod.ai) при этом
# отдаёт полноценные нативные tool_calls — что подтверждают probes через
# raw API и стабильная работа тех же моделей в kilocode.
[llm]
native_tool_calling = true
