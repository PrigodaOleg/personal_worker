# Конфигурация personal_worker — в git (секретов здесь НЕТ).
# Чувствительные значения (токены, ключи) живут в GitHub Secrets репозитория
# и при деплое рендерятся в .env шагом «Render secrets» (deploy/render_secrets.py).
# Config._env читает .env ПЕРВЫМ: значения из окружения перекрывают этот файл.
# Локальные переопределения — в .env (в git не попадает).

scheduler:
  poll_interval_seconds: 60
  clarification_poll_seconds: 30
  clarification_timeout_seconds: 172800  # 2 суток

github:
  app_id: 5366648
  installation_id: 172641927
  # PEM-ключ записывается деплоем из секрета GITHUB_APP_PRIVATE_KEY.
  private_key_path: /mnt/ssd/personal_worker/config/github-app.private-key.pem
  repo: PrigodaOleg/social_mind
  label: aitask
  poll_interval_seconds: 60

telegram:
  admin_username: prigodaoleg
  allowed_usernames: []  # пусто = все разрешены

openhands:
  base_url: http://localhost:3000
  # api_key, llm_api_key — секреты (GitHub Secrets → .env при деплое).
  llm_base_url: https://api.provod.ai/v1
  # Префикс openai/ обязателен: сообщает LiteLLM, что эндпоинт [OI]-совместимый.
  llm_model: openai/

imac:
  host: 192.168.88.19
  user: pwworker
  ssh_key: ~/.ssh/id_ed25519_pwworker
  work_dir: /Users/pwworker/personal_worker

paths:
  work_dir: /mnt/ssd/personal_worker/workspaces
  state_db: /mnt/ssd/personal_worker/state/orchestrator.sqlite
  secrets_dir: /mnt/ssd/personal_worker/secrets
