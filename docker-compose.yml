services:
  # OpenHands + Flutter SDK в одном контейнере.
  # Агент сам выполняет flutter test / flutter build внутри контейнера.
  openhands:
    build:
      context: .
      dockerfile: docker/openhands-flutter/Dockerfile
    container_name: openhands-flutter
    network_mode: host
    environment:
      - LLM_API_KEY=${OPENHANDS_LLM_API_KEY}
      - LLM_BASE_URL=${OPENHANDS_LLM_BASE_URL}
      - LLM_MODEL=${OPENHANDS_LLM_MODEL}
      - LLM_API_VERSION=v1
      - OPENHANDS_API_KEY=${OPENHANDS_API_KEY}
      - SANDBOX_URL=http://192.168.88.15:3000
      - APP_URL=http://192.168.88.15:3000
      - SANDBOX_HOST=localhost
      - USE_HOST_NETWORK=true
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORK_DIR}:/opt/openhands/workspace
      - openhands_state:/home/openhands/.local/share/openhands
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  openhands_state:
