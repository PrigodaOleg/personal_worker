services:
  # OpenHands + Flutter SDK в одном контейнере.
  # Агент сам выполняет flutter test / flutter build внутри дочернего runtime-контейнера.
  openhands:
    build:
      context: .
      dockerfile: docker/openhands-flutter/Dockerfile
    container_name: openhands-flutter
    ports:
      - "3000:3000"
    # OpenHands создаёт дочерний runtime-контейнер через Docker API и публикует
    # его порты на хост (0.0.0.0:<port>). Обращается он к нему по адресу
    # SANDBOX_LOCAL_RUNTIME_URL:<port>, который в базовом образе равен
    # http://host.docker.internal. В Linux это имя само не резолвится,
    # поэтому маппим его на шлюз хоста.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_API_KEY=${OPENHANDS_LLM_API_KEY}
      - LLM_BASE_URL=${OPENHANDS_LLM_BASE_URL}
      - LLM_MODEL=${OPENHANDS_LLM_MODEL}
      - LLM_API_VERSION=v1
      - OPENHANDS_API_KEY=${OPENHANDS_API_KEY}
      - SANDBOX_LOCAL_RUNTIME_URL=http://host.docker.internal
      - SANDBOX_RUNTIME_BINDING_ADDRESS=0.0.0.0
      - SANDBOX_USE_HOST_NETWORK=false
      # Агент выполняет команды в дочернем контейнере, поэтому Flutter нужен
      # именно в этом образе (см. docker/runtime-flutter/Dockerfile).
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=personal_worker-runtime-flutter:latest
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORK_DIR}:/opt/openhands/workspace
      - openhands_state:/home/openhands/.local/share/openhands
      # Конфиг сервера (проброс /dev/kvm в runtime-контейнеры — см. файл).
      - ./docker/openhands-flutter/config.toml:/app/config.toml:ro
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    driver: bridge
    name: personal_worker_default

volumes:
  openhands_state:
